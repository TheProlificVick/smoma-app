<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMOMA - Admin & AD Sync</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>System Administration & Directory Synchronization</h2>
        <button id="syncBtn" class="btn btn-primary">Trigger Active Directory Sync</button>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-primary text-white"><h5 class="card-title m-0">Create New User</h5></div>
                <div class="card-body">
                    <form id="createUserForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Username</label>
                                <input type="text" id="newUsername" class="form-control" placeholder="hr@art.cm" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Password</label>
                                <input type="text" id="newPassword" class="form-control" placeholder="password123" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" id="newEmail" class="form-control" placeholder="user@art.cm">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Role</label>
                                <select id="newRole" class="form-select">
                                    <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                                    <option value="ROLE_GENERAL_MANAGER">ROLE_GENERAL_MANAGER</option>
                                    <option value="ROLE_HR_OFFICER">ROLE_HR_OFFICER</option>
                                    <option value="ROLE_DEPARTMENT_REPRESENTATIVE">ROLE_DEPARTMENT_REPRESENTATIVE</option>
                                    <option value="ROLE_STAFF_MEMBER">ROLE_STAFF_MEMBER</option>
                                    <option value="ROLE_AGENT">ROLE_AGENT</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">First Name</label>
                                <input type="text" id="newNom" class="form-control" placeholder="John">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Last Name</label>
                                <input type="text" id="newPrenom" class="form-control" placeholder="Doe">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Department / Structure</label>
                                <input type="text" id="newStructure" class="form-control" placeholder="Human Resources">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-success w-100">Create User</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-6">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-dark text-white"><h5 class="card-title m-0">Create New Department</h5></div>
                <div class="card-body">
                    <form id="createDepartmentForm">
                        <div class="mb-3">
                            <label class="form-label">Department Name</label>
                            <input type="text" id="deptName" class="form-control" placeholder="Finance Department" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Acronym</label>
                            <input type="text" id="deptAcronym" class="form-control" placeholder="FIN">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Head of Department</label>
                            <input type="text" id="deptHead" class="form-control" placeholder="Mr. Smith">
                        </div>
                        <button type="submit" class="btn btn-warning text-dark w-100">Create Department</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white"><h5 class="card-title m-0">Synchronized Database Users</h5></div>
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Structure</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    function getAdminHeaders() {
        const role = localStorage.getItem('art_user_role');
        const email = localStorage.getItem('art_user_email');
        const headers = { 'Content-Type': 'application/json' };
        if (role) headers['X-User-Role'] = role;
        if (email) headers['X-User-Email'] = email;
        return headers;
    }

    async function loadUsers() {
        const res = await fetch('/api/admin/users', { headers: getAdminHeaders() });
        const users = await res.json();
        const tbody = document.getElementById('userTable');
        tbody.innerHTML = users.map(u => `
            <tr>
                <td>${u.id}</td>
                <td><strong>${u.username}</strong></td>
                <td>${(u.nom || '') + ' ' + (u.prenom || '')}</td>
                <td>${u.email || ''}</td>
                <td>${u.structure || 'N/A'}</td>
                <td><span class="badge bg-dark">${u.role}</span></td>
            </tr>
        `).join('');
    }

    document.getElementById('createUserForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            username: document.getElementById('newUsername').value.trim(),
            password: document.getElementById('newPassword').value,
            email: document.getElementById('newEmail').value.trim(),
            role: document.getElementById('newRole').value,
            nom: document.getElementById('newNom').value.trim(),
            prenom: document.getElementById('newPrenom').value.trim(),
            structure: document.getElementById('newStructure').value.trim()
        };

        const res = await fetch('/api/admin/users', {
            method: 'POST',
            headers: getAdminHeaders(),
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
            alert(data.error || 'Unable to create user');
            return;
        }

        alert('User created successfully! Username: ' + payload.username + ' Password: ' + payload.password);
        document.getElementById('createUserForm').reset();
        loadUsers();
    });

    document.getElementById('createDepartmentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = {
            name: document.getElementById('deptName').value.trim(),
            acronym: document.getElementById('deptAcronym').value.trim(),
            headName: document.getElementById('deptHead').value.trim()
        };

        const res = await fetch('/api/admin/departments', {
            method: 'POST',
            headers: getAdminHeaders(),
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
            alert(data.error || 'Unable to create department');
            return;
        }

        alert('Department created successfully: ' + payload.name);
        document.getElementById('createDepartmentForm').reset();
    });

    document.getElementById('syncBtn').addEventListener('click', async () => {
        const btn = document.getElementById('syncBtn');
        btn.disabled = true;
        btn.innerText = "Synchronizing...";
        
        try {
            const res = await fetch('/api/admin/sync-ad', { method: 'POST' });
            const data = await res.json();
            alert(`Sync complete! ${data.syncedCount} accounts synchronized from Active Directory.`);
            loadUsers();
        } catch (e) {
            alert('Error executing Active Directory sync.');
        } finally {
            btn.disabled = false;
            btn.innerText = "Trigger Active Directory Sync";
        }
    });

    loadUsers();
</script>
<script src="/js/auth-guard.js"></script>
</body>
</html>
