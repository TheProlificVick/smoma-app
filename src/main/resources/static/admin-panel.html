<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMOMA - Admin & AD Sync</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>System Administration & Directory Synchronization</h2>
        <button id="syncBtn" class="btn btn-primary">Trigger Active Directory Sync</button>
    </div>

    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white"><h5 class="card-title m-0">Synchronized Database Users</h5></div>
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Structure</th>
                        <th>Role</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function loadUsers() {
        const res = await fetch('/api/admin/users');
        const users = await res.json();
        const tbody = document.getElementById('userTable');
        tbody.innerHTML = users.map(u => `
            <tr>
                <td>${u.id}</td>
                <td><strong>${u.username}</strong></td>
                <td>${(u.nom || '') + ' ' + (u.prenom || '')}</td>
                <td>${u.email || ''}</td>
                <td>${u.structure || 'N/A'}</td>
                <td><span class="badge bg-dark">${u.role}</span></td>
            </tr>
        `).join('');
    }

    document.getElementById('syncBtn').addEventListener('click', async () => {
        const btn = document.getElementById('syncBtn');
        btn.disabled = true;
        btn.innerText = "Synchronizing...";
        
        try {
            const res = await fetch('/api/admin/sync-ad', { method: 'POST' });
            const data = await res.json();
            alert(`Sync complete! ${data.syncedCount} accounts synchronized from Active Directory.`);
            loadUsers();
        } catch (e) {
            alert('Error executing Active Directory sync.');
        } finally {
            btn.disabled = false;
            btn.innerText = "Trigger Active Directory Sync";
        }
    });

    loadUsers();
</script>
</body>
</html>
