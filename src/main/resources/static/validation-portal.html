<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SMOMA - Validation Desk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-4">General Manager / Executive Approval Desk</h2>
    <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark"><h5 class="card-title m-0">Pending Mission Orders for Approval</h5></div>
        <div class="card-body">
            <table class="table table-bordered align-middle">
                <thead>
                    <tr>
                        <th>Req ID</th>
                        <th>Title</th>
                        <th>Destination</th>
                        <th>Objective</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pendingTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    async function loadPending() {
        const res = await fetch('/api/mission-requests/my-requests');
        const data = await res.json();
        const tbody = document.getElementById('pendingTable');
        
        tbody.innerHTML = data.filter(r => r.status === 'INITIATED').map(r => `
            <tr>
                <td>${r.id}</td>
                <td>${r.title}</td>
                <td>${r.destination}</td>
                <td>${r.objective}</td>
                <td>
                    <button class="btn btn-sm btn-success me-1" onclick="review(${r.id}, true)">Approve</button>
                    <button class="btn btn-sm btn-danger" onclick="review(${r.id}, false)">Reject</button>
                </td>
            </tr>
        `).join('');
    }

    async function review(requestId, approved) {
        const comments = prompt(approved ? "Approval comments:" : "Rejection reason:");
        if (comments === null) return;

        const res = await fetch('/api/validation/gm-review', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ requestId, approved, comments, reviewerUsername: 'gm_user' })
        });

        if (res.ok) {
            alert("Mission status updated!");
            loadPending();
        }
    }

    loadPending();
</script>
</body>
</html>
