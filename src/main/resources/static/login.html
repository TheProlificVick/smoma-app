<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ART - Connexion au Système</title>
    <style>
        :root {
            --art-navy: #0F2C59;
            --art-red: #D32F2F;
            --art-gold: #FFC107;
            --bg-gray: #F4F6F9;
            --text-dark: #212529;
            --border-color: #DDE2E5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        .login-container {
            background: #FFFFFF;
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            border-radius: 8px;
            border-top: 6px solid var(--art-navy);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo-container {
            margin-bottom: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            max-height: 110px;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            padding: 4px;
            background-color: #FFFFFF;
        }

        .institution-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: #6C757D;
            text-transform: uppercase;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .app-title {
            font-size: 19px;
            font-weight: 700;
            color: var(--art-navy);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #495057;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--art-navy);
            box-shadow: 0 0 0 3px rgba(15, 44, 89, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--art-navy);
            color: #FFFFFF;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #0A1E3F;
        }

        #errorMessage {
            background-color: #FDF2F2;
            color: var(--art-red);
            border: 1px solid #F8D7DA;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .footer-credits {
            margin-top: 25px;
            text-align: center;
            font-size: 11px;
            color: #868E96;
        }

        .lang-switch-btn {
            background: none;
            border: 1px solid #ced4da;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .lang-switch-btn.active {
            background-color: var(--art-navy);
            color: #ffffff;
            border-color: var(--art-navy);
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <!-- Language Switcher Bar -->
        <div class="d-flex justify-content-end mb-3" style="display:flex; justify-content:flex-end; margin-bottom:12px; gap:6px;">
            <button type="button" class="lang-switch-btn" id="btnFr" onclick="setLoginLang('fr')">🇫🇷 FR</button>
            <button type="button" class="lang-switch-btn" id="btnEn" onclick="setLoginLang('en')">🇬🇧 EN</button>
        </div>

        <div class="header-section">
            <div class="logo-container">
                <img src="/images/ART%20logo.jpg" alt="Logo ART Cameroun" onerror="this.src='https://placehold.co/240x100/0F2C59/FFFFFF?text=ART+CAMEROUN'">
            </div>
            <div class="institution-title" data-i18n="republicOfCameroon">République du Cameroun</div>
            <div class="app-title">SMOMA</div>
            <small class="text-muted" data-i18n="portalSubTitle" style="font-size:12px; color:#6c757d;">Portail d'authentification institutionnelle</small>
        </div>

        <div id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="identity" data-i18n="identityLabel">Identifiant (Email, Nom d'utilisateur ou Matricule)</label>
                <input type="text" id="identity" class="form-control" placeholder="nom.prenom@art.cm ou matricule" required autocomplete="username" data-i18n-placeholder="identityPlaceholder">
            </div>
            
            <div class="form-group">
                <label for="password" data-i18n="passwordLabel">Mot de passe sécurisé</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit" data-i18n="loginSubmitBtn">Se connecter au Portail</button>
        </form>

        <div class="footer-credits" data-i18n="loginCredits">
            2026 Agence de Régulation des Télécommunications (ART) - République du Cameroun
        </div>
    </div>

    <script src="/js/i18n.js"></script>
    <script>
        function updateLangButtons() {
            const current = smomaI18n.getLang();
            const btnFr = document.getElementById('btnFr');
            const btnEn = document.getElementById('btnEn');
            if (btnFr && btnEn) {
                btnFr.classList.toggle('active', current === 'fr');
                btnEn.classList.toggle('active', current === 'en');
            }
        }

        function setLoginLang(lang) {
            smomaI18n.switchLanguage(lang);
            updateLangButtons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateLangButtons();
        });

        document.getElementById("loginForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const errorBanner = document.getElementById("errorMessage");
            errorBanner.style.display = "none";

            localStorage.setItem("art_authenticated", "false");

            const identVal = document.getElementById("identity").value.trim();
            const payload = {
                email: identVal,
                username: identVal,
                matricule: identVal,
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem("art_authenticated", "true");
                    localStorage.setItem("art_auth_token", data.token || "");
                    localStorage.setItem("user_name", data.fullName || "Agent ART");
                    localStorage.setItem("art_user_role", data.role || "ROLE_AGENT");
                    localStorage.setItem("art_user_email", data.username || "");
                    localStorage.setItem("art_user_designation", data.designation || "");
                    if (data.matricule) {
                        localStorage.setItem("art_user_matricule", data.matricule);
                    }
                    window.location.href = "index.html";
                } else {
                    errorBanner.innerText = t('loginErrorMsg');
                    errorBanner.style.display = "block";
                }
            } catch (err) {
                errorBanner.innerText = t('networkErrorMsg');
                errorBanner.style.display = "block";
            }
        });
    </script>
</body>
</html>
