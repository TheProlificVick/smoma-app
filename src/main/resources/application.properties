spring.application.name=smoma


# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/smoma_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=TruthOfVick26!
# Use update instead of create-drop so the schema is preserved across restarts and startup stays clean.
spring.jpa.hibernate.ddl-auto=update
# Keep the session open during view rendering: every REST controller returns JPA entities
# directly and the HTML pages read nested lazy associations (etapes, personnelList, personnel,
# mandatDeMission). Without this, Jackson serialization triggers LazyInitializationException -> HTTP 500.
spring.jpa.open-in-view=true

# Active Directory / LDAP Integration (Configured for ART Server binding)
server.port=8086

spring.ldap.urls=ldap://192.168.0.101
spring.ldap.base=dc=art,dc=cm
spring.ldap.username=lucien.mba@art.cm
spring.ldap.password=@Wdsi@2913@

# JWT Configuration
jwt.secret=9a2f8c4e1b7d3a5f8e0c2b4a6f9d1e3c5b7a9f0e2d4c6b8a1f3e5d7c9b0a2f4e
jwt.expiration=28800000

# File uploads: signed mandate/OM scans and mission reports (served back at /uploads/**).
smoma.uploads.dir=${SMOMA_UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Demo/sample data (guessable-password logins, fabricated indemnity rates, sample personnel).
# MUST stay false for production — DataLoader still creates one real bootstrap admin account
# regardless (see server log on first startup), and AD sync populates real staff separately.
smoma.seed-demo-data=${SMOMA_SEED_DEMO_DATA:false}